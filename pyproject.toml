[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "summarizer"
version = "0.1.0"
description = "Gemma3-270M distillation for JSON generation with title and git branch names"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
keywords = ["llm", "fine-tuning", "distillation", "dpo", "unsloth", "ollama"]

dependencies = [
    # Core ML frameworks (used by training scripts)
    "torch>=2.5.0",
    # Unsloth
    "transformers>4.55.1,<=4.57.2",
    "trl>=0.23.0",
    "unsloth==2025.10.10",
    "unsloth-zoo==2025.10.12",
    "xformers",
    "accelerate>=1.2.0",
    # Training (for Axolotl configs if needed)
    "peft>=0.13.0",
    # Data & Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Analysis
    "marimo",
    # CLI & UI
    "rich>=13.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0", # For synthetic data generation
    "openai>=1.0.0", # For OpenAI-based synthetic data generation
    "datasets>=3.2.0",
    "jsonlines>=4.0.0",
    "pandas>=2.0.0",
    "altair>=5.0.0",
    "tqdm>=4.0.0",
    # Monitoring
    "wandb>=0.18.0",
    "weave>=0.51.0",
]

[project.optional-dependencies]
# Optional training frameworks
# Axolotl doesn't support cu13 yet 
# axolotl = [
#    "axolotl"
# ]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
]
torchaudio = [
  { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
]
xformers = {git="https://github.com/johnnynunez/xformers", branch="main"}

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "ipython>=8.37.0",
    "ipykernel>=6.29.0",
    "groq>=0.33.0",
]

# ARM64 specific torch configuration for DGX Spark
[tool.uv]
override-dependencies = [
  "torch>=2.9.0",
  "packaging>=24.2",
  "transformers>=4.56.0",
]
environments = ["platform_machine == 'aarch64'"]  # Only resolve for ARM64 (DGX Spark)
no-build-isolation-package= ["xformers"]